# companies.yaml -- RESEARCH search (C:\Projects\Research)
#
# Every greenhouse token below was verified on 2026-09-14 by calling
# https://boards-api.greenhouse.io/v1/boards/<token>/jobs and reading the
# returned titles. The count and the quoted title after each entry are from
# that live response -- nothing here is a guessed token. Tokens that 404'd
# (hudsonrivertrading, axqcap) and stub boards with no real postings
# (exoduspoint, 2 placeholder entries) were dropped.
#
# Summer 2027 PhD internship postings are already open across most of these
# boards as of 2026-09-14, so the first collect run should land on live
# applications rather than an empty corpus.

